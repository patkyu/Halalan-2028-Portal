name: Daily data update

on:
  schedule:
    - cron: "17 22 * * *"   # every day, 06:17 Philippine time
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write   # commit news.json / photos.json
  issues: write     # open the review issue

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check curated data
        run: python scraper/validate.py

      - name: Scrape news, surveys and COMELEC updates
        id: scrape
        run: python scraper/scrape.py

      - name: Publish news feed and photos
        run: |
          git config user.name "halalan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json photos.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Daily update: ${{ steps.scrape.outputs.new_items }} new article(s)"
            git push
          fi

      - name: Open a review issue for possible fact changes
        if: steps.scrape.outputs.flags != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create needs-review --color 5a3fa3 --description "Scraper found something to check" --force
          gh issue create \
            --title "Review: ${{ steps.scrape.outputs.flags }} possible update(s) — $(date -u +%F)" \
            --label needs-review \
            --body-file review.md
